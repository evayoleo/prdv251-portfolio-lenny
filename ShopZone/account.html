<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone | Account</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <h1>ShopZone</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="categories.html">Categories</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Cart</a>
            <a href="account.html">Account</a>
        </nav>
    </header>

    <main>
        <h2>Your Account</h2>
        <p>Sign in to view your account.</p>

        <!-- This form is a visual layout for now; it will not sign users in yet. -->
        <form>
            <fieldset>
                <legend>Sign In</legend>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit">Sign In</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <h2>ShopZone</h2>
        <p>Your one-stop shop for great products at great prices.</p>
        <p>&copy; 2026 ShopZone. All rights reserved.</p>
    </footer>

</body>
</html>
